<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="17 open-source projects, 27 certifications, 5+ languages shipped, 2 continents served">
  <title>17 open-source projects, 27 certifications, 5+ languages shipped, 2 continents served</title>
  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1f2c27" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gm"><rect width="1200" height="150" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="150" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <style>
    .s{font-family:'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .i{font-family:Georgia, 'Times New Roman', serif;font-style:italic}
    @keyframes drift{to{transform:translate(60px,30px)}} @keyframes tw{50%{opacity:.25}} @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}} @keyframes dash{to{stroke-dashoffset:0}} @keyframes spin{to{transform:rotate(360deg)}}
    .up{opacity:0;animation:up .9s cubic-bezier(.22,.8,.22,1) forwards}
    @media (prefers-reduced-motion:reduce){*{animation:none!important} .up{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="150" fill="#090e0c"/>
    <rect width="1200" height="150" fill="url(#g)" mask="url(#gm)" opacity=".7"/>
    <circle cx="140" cy="-20" r="190" fill="#5fe3b0" opacity=".16" filter="url(#blur)" style="animation:drift 14s ease-in-out infinite alternate"/>
    <circle cx="1080" cy="160" r="170" fill="#f1b76b" opacity=".09" filter="url(#blur)" style="animation:drift 18s ease-in-out infinite alternate-reverse"/>
    <g class="up" style="animation-delay:0.00s"><text x="56" y="82" class="s" font-size="50" font-weight="700" letter-spacing="-2" fill="#eef4f0">17<tspan fill="#5fe3b0"></tspan></text><text x="56" y="110" class="s" font-size="15" fill="#7e8d86">Open-source projects</text><path d="M56 124h44" stroke="#5fe3b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" style="animation:dash 1.2s cubic-bezier(.22,.8,.22,1) 0.40s forwards"/></g><line x1="300" y1="34" x2="300" y2="116" stroke="#1f2c27"/><g class="up" style="animation-delay:0.15s"><text x="356" y="82" class="s" font-size="50" font-weight="700" letter-spacing="-2" fill="#eef4f0">27<tspan fill="#5fe3b0"></tspan></text><text x="356" y="110" class="s" font-size="15" fill="#7e8d86">Certifications</text><path d="M356 124h44" stroke="#5fe3b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" style="animation:dash 1.2s cubic-bezier(.22,.8,.22,1) 0.55s forwards"/></g><line x1="600" y1="34" x2="600" y2="116" stroke="#1f2c27"/><g class="up" style="animation-delay:0.30s"><text x="656" y="82" class="s" font-size="50" font-weight="700" letter-spacing="-2" fill="#eef4f0">5<tspan fill="#5fe3b0">+</tspan></text><text x="656" y="110" class="s" font-size="15" fill="#7e8d86">Languages shipped</text><path d="M656 124h44" stroke="#5fe3b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" style="animation:dash 1.2s cubic-bezier(.22,.8,.22,1) 0.70s forwards"/></g><line x1="900" y1="34" x2="900" y2="116" stroke="#1f2c27"/><g class="up" style="animation-delay:0.45s"><text x="956" y="82" class="s" font-size="50" font-weight="700" letter-spacing="-2" fill="#eef4f0">2<tspan fill="#5fe3b0"></tspan></text><text x="956" y="110" class="s" font-size="15" fill="#7e8d86">Continents served</text><path d="M956 124h44" stroke="#5fe3b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" style="animation:dash 1.2s cubic-bezier(.22,.8,.22,1) 0.85s forwards"/></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="149" rx="22" fill="none" stroke="#2a3a33"/>
</svg>
